name = "thread-academy-tutor"
main = "worker.js"
compatibility_date = "2026-09-01"

# Comma-separated; "*.vercel.app" covers preview deployments.
ALLOWED_ORIGINS = "https://threadacademy.aaquibali.com,*.vercel.app"

[vars]
LLM_BASE_URL = "https://api.openai.com/v1"
LLM_MODEL = "gpt-4o-mini"

